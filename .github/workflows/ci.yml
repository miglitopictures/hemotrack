name: CI

## Quando?
on:
  # sempre que fizermos push ou pr para <main>
  push:
    branches: [main]
  pull_request:
    branches: [main]

## O que?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
        ## clona repo no ambiente virtual
      - name: Check out code
        uses: actions/checkout@v4

        ## instala jdk 21 no ambiente virtual
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

        ## roda o script de teste do Maven (ferramenta de build que usamos com spring)
      - name: Build and run tests
        working-directory: backend
        run: ./mvnw -B clean verify

        ## sobe o report de resultados do teste
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
  
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

        ## npm ci instala exatamente o que está no package-lock, sem atualizar nada
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

        ## compila o TypeScript e gera o bundle — é aqui que erro de tipo aparece
      - name: Build
        working-directory: frontend
        run: npm run build

  ## etapa de IMAGEM: gera a imagem Docker do backend com o mesmo Dockerfile que o Render usa.
  ## so roda se os testes passaram; se o Dockerfile quebrar, o deploy nao acontece.
  docker-image:
    needs: [build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

        ## o estagio 1 do Dockerfile compila e roda os testes de novo, agora dentro do container
      - name: Build da imagem do backend
        run: docker build -t hemotrack-api:${{ github.sha }} backend

  ## roda so depois de testes + imagem passarem, e so quando o push foi na main
  ## esteira completa: build -> testes -> imagem -> deploy
  deploy:
    needs: [build-and-test, build-frontend, docker-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
        ## dispara o deploy no Render via Deploy Hook
        ## RENDER_DEPLOY_HOOK_URL fica em Settings > Secrets and variables > Actions do repo no GitHub
        ## (copia a URL em Render > o Web Service > Settings > Deploy Hook)
      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Trigger Render deploy (frontend)
        run: curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"