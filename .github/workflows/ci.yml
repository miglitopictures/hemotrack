name: CI

## Quando?
on:
  # sempre que fizermos push ou pr para <main>
  push:
    branches: [main]
  pull_request:
    branches: [main]

## O que?
jobs:
  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and Prometheus configuration
        run: |
          docker compose --env-file .env.example config --quiet
          docker run --rm --entrypoint /bin/promtool -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml

  build-and-test:
    runs-on: ubuntu-latest

    steps:
        ## clona repo no ambiente virtual
      - name: Check out code
        uses: actions/checkout@v4

        ## instala jdk 21 no ambiente virtual
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

        ## roda o script de teste do Maven (ferramenta de build que usamos com spring)
      - name: Build and run tests
        working-directory: backend
        run: ./mvnw -B clean verify

        ## sobe o report de resultados do teste
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
  
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

        ## npm ci instala exatamente o que está no package-lock, sem atualizar nada
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

        ## compila o TypeScript e gera o bundle — é aqui que erro de tipo aparece
      - name: Build
        working-directory: frontend
        run: npm run build

  ## etapa de IMAGEM: gera a imagem Docker do backend com o mesmo Dockerfile que o Render usa.
  ## so roda se os testes passaram; se o Dockerfile quebrar, o deploy nao acontece.
  docker-image:
    needs: [build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

        ## o estagio 1 do Dockerfile compila e roda os testes de novo, agora dentro do container
      - name: Build da imagem do backend
        run: docker build -t hemotrack-api:${{ github.sha }} backend

  ## roda so depois de testes + imagem passarem, e so quando o push foi na main
  ## esteira completa: build -> testes -> imagem -> deploy
  deploy:
    needs: [build-and-test, build-frontend, docker-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
        ## dispara o deploy no Render via Deploy Hook
        ## RENDER_DEPLOY_HOOK_URL fica em Settings > Secrets and variables > Actions do repo no GitHub
        ## (copia a URL em Render > o Web Service > Settings > Deploy Hook)
      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Trigger Render deploy (frontend)
        run: curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
  
  ## TESTE DE FUMACA: roda depois do deploy e confirma que a versao NOVA responde.
  ## O Render demora para construir e subir (no plano Free, minutos), e enquanto isso continua
  ## servindo a versao anterior: por isso espera o /health informar o commit deste push.
  smoke:
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: https://hemotrack-api-3ns9.onrender.com

    steps:
      - name: Espera a versao nova entrar no ar
        run: |
          for i in $(seq 1 60); do
            corpo=$(curl -s --max-time 10 "$API_URL/health" || true)
            echo "tentativa $i: $corpo"
            if echo "$corpo" | grep -q "\"versao\":\"$GITHUB_SHA\"" && echo "$corpo" | grep -q '"status":"UP"'; then
              echo "versao $GITHUB_SHA no ar"
              exit 0
            fi
            sleep 15
          done
          echo "a versao $GITHUB_SHA nao respondeu em 15 minutos"
          exit 1

      - name: Rota protegida exige autenticacao
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/requisicoes")
          echo "GET /requisicoes sem token: $status"
          test "$status" = "401"