name: CI

## Quando?
on:
  # sempre que fizermos push ou pr para <main>
  push:
    branches: [main]
  pull_request:
    branches: [main]

## O que?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
        ## clona repo no ambiente virtual
      - name: Check out code
        uses: actions/checkout@v4

        ## instala jdk 21 no ambiente virtual
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

        ## roda o script de teste do Maven (ferramenta de build que usamos com spring)
      - name: Build and run tests
        working-directory: backend
        run: ./mvnw -B clean verify

        ## sobe o report de resultados do teste
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  ## roda so depois do build-and-test passar, e so quando o push foi na main
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
        ## dispara o deploy no Render via Deploy Hook
        ## RENDER_DEPLOY_HOOK_URL fica em Settings > Secrets and variables > Actions do repo no GitHub
        ## (copia a URL em Render > o Web Service > Settings > Deploy Hook)
      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"