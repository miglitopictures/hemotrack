spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.springframework.web=INFO

spring.mvc.problemdetails.enabled=true

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,metrics,info
management.metrics.tags.application=hemotrack-backend
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_ENDPOINT:}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_TOKEN:}
management.otlp.metrics.export.step=10s