# Perfil adicional do laboratorio: prod,observabilidade. Nao altera o Render.
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
management.opentelemetry.resource-attributes.service.name=hemotrack-backend
logging.file.name=/app/logs/hemotrack.json
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}]
