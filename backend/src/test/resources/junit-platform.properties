# Cucumber roda só pela suite (CucumberTest), não como engine raiz: evita rodar duas vezes
cucumber.junit-platform.discovery.as-root-engine=false
cucumber.glue=com.hemotrack.backend.bdd
cucumber.plugin=pretty, html:target/cucumber-report.html
# cenários em construção ficam fora da esteira (sobrescrevível por -Dcucumber.filter.tags)
cucumber.filter.tags=not @wip