server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: as rotas (/hospital, /login...) existem so no JavaScript.
    # Qualquer caminho que nao seja um arquivo devolve o index.html,
    # senao um F5 em /hospital/solicitacoes daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
